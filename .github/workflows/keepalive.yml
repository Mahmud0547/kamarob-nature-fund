name: Keep the demo awake

# A free Supabase project pauses after a week without traffic. Opening a page that reads the database once a day
# keeps the public demo available for visitors.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 60 -o /dev/null https://kamarob.simorgh-dev.workers.dev/en/news
